name: Publier le site

on:
  push:
    branches: [main]
  # Reconstruit le site toutes les 2 heures pour récupérer les nouveaux articles RSS.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

# Aucune permission par défaut : chaque job ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA de commit (protection contre une étiquette déplacée).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : aucun script d'installation de dépendance n'est exécuté.
      - run: npm ci --ignore-scripts
      - name: Vérifier les signatures des paquets npm
        run: npm audit signatures
      # Conserve les résumés déjà rédigés : seuls les nouveaux articles passent par l'IA.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/news/summaries.json
          key: news-summaries-${{ github.run_id }}
          restore-keys: news-summaries-
      - name: Récupérer les actus et rédiger les résumés
        run: npm run news
        env:
          # Secret AI_API_KEY et variable AI_PROVIDER (mistral ou gemini) : Settings → Secrets and variables → Actions
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      - name: Construire le site statique
        run: npm run build
        env:
          # GitHub Pages publie le site sous https://<utilisateur>.github.io/<dépôt>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
