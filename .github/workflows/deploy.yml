name: Publier le site

on:
  push:
    branches: [main]
  # Reconstruit le site toutes les heures pour récupérer les nouveaux articles RSS.
  schedule:
    - cron: "17 * * * *"
    # Jeudi, juste après le changement des jeux gratuits Epic (17 h à Paris = 15 h ou 16 h UTC).
    - cron: "5 15,16 * * 4"
  workflow_dispatch:

# Aucune permission par défaut : chaque job ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA de commit (protection contre une étiquette déplacée).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : aucun script d'installation de dépendance n'est exécuté.
      - run: npm ci --ignore-scripts
      - name: Vérifier les signatures des paquets npm
        run: npm audit signatures
      # Conserve les résumés déjà rédigés et l'archive des actus d'un build à l'autre.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/news/summaries.json
            .cache/news/archive.json
            .cache/news/proofread.json
            .cache/news/scores-v2.json
            .cache/news/images.json
            .cache/news/games-db.json
            .cache/news/anime-fr.json
          key: news-summaries-${{ github.run_id }}
          restore-keys: news-summaries-
      - name: Récupérer les actus et rédiger les résumés
        run: npm run news
        env:
          # Secret AI_API_KEY et variable AI_PROVIDER (mistral ou gemini) : Settings → Secrets and variables → Actions
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          # Facultatif : clé gratuite RAWG (rawg.io/apidocs) pour un calendrier toutes plateformes
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          # Articles écrits dans le tableau de bord (lecture publique des articles publiés)
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Construire le site statique
        run: npm run build
        env:
          # GitHub Pages publie le site sous https://<utilisateur>.github.io/<dépôt>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Commentaires / j'aime (facultatif) : variables publiques du projet Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          NEXT_TELEMETRY_DISABLED: 1
      # Contrôle avant publication : les pages et la recherche sont ouvertes comme dans l'app iPhone,
      # avec les vraies données. Une page qui plante bloque la publication (le site en ligne reste intact).
      - name: Vérifier que les pages s'affichent sans erreur
        run: |
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Notifications web (OneSignal) des nouvelles actus, une fois le site en ligne (le lien de la
  # notification ouvre donc une page qui existe). Sans le secret ONESIGNAL_API_KEY, rien n'est envoyé.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mêmes chemins que dans « build » : c'est ce qui permet de retrouver l'archive des actus de ce build.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/news/summaries.json
            .cache/news/archive.json
            .cache/news/proofread.json
            .cache/news/scores-v2.json
            .cache/news/images.json
            .cache/news/games-db.json
            .cache/news/anime-fr.json
          key: news-summaries-${{ github.run_id }}
      # Articles déjà annoncés, d'une exécution à l'autre.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/news/push-state.json
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Envoyer les notifications web
        run: node scripts/send-push.mjs
        env:
          # Secret ONESIGNAL_API_KEY (clé API REST de OneSignal) : Settings → Secrets and variables → Actions
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
