name: Application iOS

# Compile l'application iPhone (IPA non signée, à installer avec AltStore ou SideStore qui la signent
# avec l'identifiant Apple de l'utilisateur) et la publie dans la release « ios ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "public/icon-512.png"

permissions: {}

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # publier l'IPA dans une « release »
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choisir le Xcode le plus récent
        # Le SDK d'iOS 26 ou plus donne à la barre d'onglets l'effet « Liquid Glass » d'Apple.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Icône de l'application
        run: sips -z 1024 1024 public/icon-512.png --out ios/GamingBase/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Compiler l'application
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project GamingBase.xcodeproj -target GamingBase -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="1.0.${GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -40; tail -n 30 build.log; exit 1; }
          tail -n 5 build.log
          test -d build/Release-iphoneos/GamingBase.app

      - name: Créer l'IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/GamingBase.app Payload/
          test -d Payload/GamingBase.app/PlugIns/GamingBaseWidgets.appex
          # Signature « ad hoc » portant les droits (groupe partagé app ↔ widgets) :
          # AltStore les lit pour créer le groupe, puis re-signe avec l'identifiant Apple.
          codesign -f -s - --entitlements Widgets/Widgets.entitlements Payload/GamingBase.app/PlugIns/GamingBaseWidgets.appex
          codesign -f -s - --entitlements GamingBase/GamingBase.entitlements Payload/GamingBase.app
          codesign -d --entitlements - Payload/GamingBase.app | head -20
          zip -qry "$RUNNER_TEMP/GamingBase.ipa" Payload
          shasum -a 256 "$RUNNER_TEMP/GamingBase.ipa"

      - name: Publier l'IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Application iPhone de GamingBase (compilation n°${GITHUB_RUN_NUMBER}).
          IPA non signée : à installer avec AltStore (ou SideStore), qui la signe avec ton identifiant Apple.
          L'application affiche le site en ligne : elle est toujours à jour sans réinstallation."
          if gh release view ios >/dev/null 2>&1; then
            gh release edit ios --title "GamingBase pour iPhone" --notes "$NOTES"
          else
            gh release create ios --target "$GITHUB_SHA" --title "GamingBase pour iPhone" --notes "$NOTES" --latest=false
          fi
          gh release upload ios "$RUNNER_TEMP/GamingBase.ipa" --clobber

      - name: Source AltStore (altstore.json)
        # Source à ajouter dans AltStore / SideStore : https://github.com/<dépôt>/releases/download/ios/altstore.json
        # Elle décrit la dernière IPA (version, taille) : AltStore propose la mise à jour tout seul.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          ipa = os.path.join(os.environ["RUNNER_TEMP"], "GamingBase.ipa")
          run = os.environ["GITHUB_RUN_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          site = "https://makaveli63.github.io/Webapp-"
          icon = f"{site}/icon-512.png"
          desc = ("L'actualité du jeu vidéo et de l'anime en français : news, tests, sorties, épisodes, "
                  "jeux gratuits et promos. Widgets, notifications, compte à rebours en direct et profil de joueur.")
          source = {
              "name": "GamingBase",
              "identifier": "io.github.makaveli63.gamingbase.source",
              "subtitle": "L'actu jeu vidéo et anime",
              "description": desc,
              "iconURL": icon,
              "website": f"{site}/",
              "tintColor": "#6c4cf5",
              "featuredApps": ["io.github.makaveli63.gamingbase"],
              "apps": [{
                  "name": "GamingBase",
                  "bundleIdentifier": "io.github.makaveli63.gamingbase",
                  "developerName": "Makaveli63",
                  "subtitle": "L'actu jeu vidéo et anime",
                  "localizedDescription": desc,
                  "iconURL": icon,
                  "tintColor": "#6c4cf5",
                  "category": "entertainment",
                  "screenshots": [],
                  "versions": [{
                      "version": f"1.0.{run}",
                      "buildVersion": run,
                      "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": f"Compilation n°{run}. Le contenu vient du site en ligne : il est toujours à jour.",
                      "downloadURL": f"https://github.com/{repo}/releases/download/ios/GamingBase.ipa",
                      "size": os.path.getsize(ipa),
                      "minOSVersion": "16.0",
                  }],
                  "appPermissions": {
                      "entitlements": ["com.apple.security.application-groups"],
                      "privacy": {
                          "NSMicrophoneUsageDescription": "Recherche vocale.",
                          "NSSpeechRecognitionUsageDescription": "Transformer la voix en texte pour la recherche.",
                          "NSFaceIDUsageDescription": "Protéger le mot de passe du tableau de bord administrateur.",
                      },
                  },
              }],
              "news": [],
          }
          out = os.path.join(os.environ["RUNNER_TEMP"], "altstore.json")
          with open(out, "w", encoding="utf-8") as f:
              json.dump(source, f, ensure_ascii=False, indent=2)
          print(open(out, encoding="utf-8").read()[:400])
          PY
          gh release upload ios "$RUNNER_TEMP/altstore.json" --clobber
