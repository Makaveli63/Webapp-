name: Application Android

# Compile l'APK de GamingBase et le publie sur la page « Releases » du dépôt
# (lien direct : https://github.com/Makaveli63/Webapp-/releases/latest).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "public/icon-512.png"

permissions: {}

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # publier l'APK dans une « release »
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle officiel, empreinte SHA-256 vérifiée (pas d'action tierce).
      - name: Installer Gradle
        run: |
          V=8.10.2
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$V-bin.zip"
          echo "$(curl -fsSL "https://services.gradle.org/distributions/gradle-$V-bin.zip.sha256")  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$V/bin" >> "$GITHUB_PATH"

      - name: Icône de l'application
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # Clé de signature fixe : créée une seule fois, puis conservée CHIFFRÉE (AES-256, mot de passe =
      # secret ANDROID_KEYSTORE_PASSWORD) dans la release « android ». Même clé à chaque version :
      # l'APK se met à jour par-dessus l'ancien sans désinstaller. Sans le secret : clé de test.
      - name: Clé de signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_PASSWORD absent : APK signé avec une clé de test."
            exit 0
          fi
          if [ "${#KEYSTORE_PASSWORD}" -lt 16 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD doit faire au moins 16 caractères."
            exit 1
          fi
          KEY="$RUNNER_TEMP/release.jks"
          # Liste des fichiers de la release : en cas d'échec, on s'arrête plutôt que de recréer une clé.
          gh release view android >/dev/null 2>&1 || gh release create android --target "$GITHUB_SHA" --title "GamingBase pour Android" --notes "…"
          ASSETS=$(gh release view android --json assets --jq '.assets[].name') || { echo "::error::Release illisible."; exit 1; }
          if grep -qx "signing-key.enc" <<<"$ASSETS"; then
            gh release download android --pattern signing-key.enc --dir "$RUNNER_TEMP"
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/signing-key.enc" -out "$KEY" -pass env:KEYSTORE_PASSWORD; then
              echo "::error::Impossible de déchiffrer la clé : le mot de passe ANDROID_KEYSTORE_PASSWORD a changé."
              exit 1
            fi
            echo "Clé de signature existante réutilisée."
          else
            "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore "$KEY" -storetype PKCS12 \
              -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD -alias gamingbase \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Makaveli63, O=GamingBase, C=FR"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -in "$KEY" -out "$RUNNER_TEMP/signing-key.enc" -pass env:KEYSTORE_PASSWORD
            gh release upload android "$RUNNER_TEMP/signing-key.enc" --clobber
            echo "Nouvelle clé de signature créée et conservée chiffrée."
          fi
          echo "KEYSTORE_FILE=$KEY" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cd android
          gradle --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/GamingBase.apk"
          sha256sum "$RUNNER_TEMP/GamingBase.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Application Android de GamingBase (compilation n°${GITHUB_RUN_NUMBER}).
          Sur ton téléphone Android : télécharge GamingBase.apk ci-dessous, ouvre-le et autorise l'installation.
          L'application affiche le site en ligne : elle est toujours à jour sans réinstallation.
          (signing-key.enc : fichier technique chiffré utilisé par GitHub pour signer l'APK, inutile de le télécharger.)"
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --title "GamingBase pour Android" --notes "$NOTES" --latest
          else
            gh release create android --target "$GITHUB_SHA" --title "GamingBase pour Android" --notes "$NOTES" --latest
          fi
          gh release upload android "$RUNNER_TEMP/GamingBase.apk" --clobber
