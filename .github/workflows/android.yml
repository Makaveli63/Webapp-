name: Application Android

# Compile l'APK de GamingBase et le publie sur la page « Releases » du dépôt
# (lien direct : https://github.com/Makaveli63/Webapp-/releases/latest).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "public/icon-512.png"

permissions: {}

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # publier l'APK dans une « release »
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle officiel, empreinte SHA-256 vérifiée (pas d'action tierce).
      - name: Installer Gradle
        run: |
          V=8.10.2
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$V-bin.zip"
          echo "$(curl -fsSL "https://services.gradle.org/distributions/gradle-$V-bin.zip.sha256")  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$V/bin" >> "$GITHUB_PATH"

      - name: Icône de l'application
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp public/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compiler l'APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          # Clé de signature fixe (facultative) : sans elle, l'APK est signé avec une clé de test.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          cd android
          gradle --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/GamingBase.apk"
          sha256sum "$RUNNER_TEMP/GamingBase.apk"

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Application Android de GamingBase (compilation n°${GITHUB_RUN_NUMBER}).
          Sur ton téléphone Android : télécharge GamingBase.apk ci-dessous, ouvre-le et autorise l'installation.
          L'application affiche le site en ligne : elle est toujours à jour sans réinstallation."
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --title "GamingBase pour Android" --notes "$NOTES" --latest
          else
            gh release create android --target "$GITHUB_SHA" --title "GamingBase pour Android" --notes "$NOTES" --latest
          fi
          gh release upload android "$RUNNER_TEMP/GamingBase.apk" --clobber
