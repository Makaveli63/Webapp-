# Projet Xcode généré sur le Mac de GitHub par XcodeGen (voir .github/workflows/ios.yml).
name: GamingBase
options:
  bundleIdPrefix: io.github.makaveli63
  deploymentTarget:
    iOS: "16.0"
targets:
  GamingBase:
    type: application
    platform: iOS
    sources:
      - path: GamingBase
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    dependencies:
      - target: GamingBaseWidgets
    info:
      path: GamingBase/Info.plist
      properties:
        CFBundleDisplayName: GamingBase
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        # Domaines de l'app : nécessaires au mode hors connexion (service worker) dans la vue web.
        WKAppBoundDomains:
          - makaveli63.github.io
          - www.youtube-nocookie.com
        NSMicrophoneUsageDescription: GamingBase utilise le micro uniquement pour la recherche vocale.
        NSSpeechRecognitionUsageDescription: GamingBase transforme ta voix en texte pour la recherche vocale.
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.makaveli63.gamingbase.news
        CFBundleURLTypes:
          - CFBundleURLName: io.github.makaveli63.gamingbase
            CFBundleURLSchemes:
              - gamingbase
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.makaveli63.gamingbase
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"

  GamingBaseWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0" # widgets configurables (App Intents)
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: GamingBase
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.makaveli63.gamingbase.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
